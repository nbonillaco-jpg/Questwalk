<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>QuestWalk</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#11130e;color:#eee5ce;font-family:Georgia,serif}.top{padding:32px 18px 15px;background:#10120e;border-bottom:1px solid #514831}.brand{font-size:26px;font-weight:bold}.sub{color:#c6a963;font:12px -apple-system,sans-serif;letter-spacing:1px}
.map{min-height:650px;position:relative;overflow:hidden;background:linear-gradient(#3c5b59 0 19%,#9b9362 20%,#68754e 70%,#817655)}
.map:after{content:"";position:absolute;inset:19% 0 0;opacity:.25;background:repeating-linear-gradient(25deg,transparent 0 22px,#303b24 23px 24px)}
.card{position:absolute;z-index:2;top:20px;left:16px;right:16px;background:#dfc99a;color:#251e15;padding:15px;border:1px solid #856c46;box-shadow:0 5px 18px #0008}.card h1{margin:4px 0;font-size:25px}
.bar{height:10px;background:#9a8965;border-radius:8px;overflow:hidden}.fill{height:100%;background:#49613a;width:0}.stats{display:flex;justify-content:space-between;font-weight:bold;font-size:12px;margin-top:7px}
.route{position:absolute;z-index:2;top:35%;left:10%;right:10%;bottom:10%}.line{position:absolute;left:10%;top:5%;width:78%;height:75%;border-left:3px dashed #efe2bd;border-bottom:3px dashed #efe2bd;transform:skewY(15deg) rotate(-8deg);border-radius:0 0 0 60%}
.pin{position:absolute;transform:translate(-50%,-50%);text-align:center}.pin button{width:36px;height:36px;border-radius:50%;border:3px solid #d5b04d;background:#292a22;color:#f3d56f;font-weight:bold}.pin.done button{background:#425e39;color:#fff}.pin.now button{box-shadow:0 0 0 7px #e5b93855,0 0 20px #e5b938}.pin label{display:block;background:#dbc69a;color:#271f15;padding:3px 6px;margin-top:3px;font-size:11px;font-weight:bold;white-space:nowrap}
.bottom{padding:16px}.bottom b{font-size:21px}.muted{color:#a9a18c;font:13px -apple-system,sans-serif}.buttons{display:flex;gap:8px;margin-top:12px}.buttons button{flex:1;padding:12px;background:#34362b;color:white;border:1px solid #5a5544;border-radius:8px;font-weight:bold}
.overlay{display:none;position:fixed;inset:0;z-index:10;background:#292318;padding:18px;overflow:auto}.overlay.on{display:block}.book{background:#ead8ae;color:#291f15;padding:22px;min-height:90vh;border:1px solid #876e48;box-shadow:0 4px 20px #0008}.book h1{text-align:center;margin-bottom:2px}.date{text-align:center;font-weight:bold}.art{height:210px;margin:18px 0;background:linear-gradient(#b9ad91,#737365);border:1px solid #8e8065;position:relative}.art:after{content:"FIELD SKETCH · NORMANDY";position:absolute;bottom:8px;right:8px;font-size:10px}.story{font-size:17px;line-height:1.5}.story:first-letter{float:left;font-size:55px;line-height:.8;color:#81382c;padding-right:7px}.tag{font:800 10px -apple-system,sans-serif;letter-spacing:1px;border:1px solid #796447;display:inline-block;padding:5px;margin-top:12px}.back{background:none;border:0;color:#e5c164;font-weight:bold;padding:0 0 12px}
</style></head><body>
<div class="top"><div class="brand">✦ QUESTWALK</div><div class="sub">NORMANDY 1944 · 1ST INFANTRY DIVISION</div></div>
<div class="map"><div class="card"><div class="sub" style="color:#685638">QUEST 001 · WWII</div><h1>NORMANDY 1944</h1><div>Omaha Beach → Caumont</div><div class="bar"><div id="fill" class="fill"></div></div><div class="stats"><span id="miles"></span><span id="count"></span></div></div><div class="route"><div class="line"></div><div id="pins"></div></div></div>
<div class="bottom"><div class="sub">NEXT OBJECTIVE</div><b id="next"></b><div id="remain" class="muted"></div><div class="buttons"><button onclick="add(.25)">+0.25 MI</button><button onclick="add(1)">+1 MI</button><button onclick="reset()">RESET</button></div></div>
<div id="overlay" class="overlay"><button class="back" onclick="closeStory()">← RETURN TO MAP</button><div class="book"><div class="sub" style="text-align:center;color:#715b3b" id="num"></div><h1 id="name"></h1><div class="date" id="date"></div><div class="art"></div><div class="story" id="story"></div><div class="tag" id="tag"></div></div></div>
<script>
const S=[["Omaha Beach","June 6, 1944",0,"DOCUMENTED","The journey begins on Omaha Beach with the 1st Infantry Division among the American assault forces."],["Beach Bluffs","June 6, 1944",.7,"APPROXIMATE","Assault elements pushed off the exposed beach, through exits and up the bluffs while fighting continued around them."],["Colleville-sur-Mer","June 6, 1944",1.8,"DOCUMENTED","Elements of the 16th Infantry fought inland around Colleville-sur-Mer as the Omaha beachhead expanded."],["Inland Beachhead","June 7, 1944",4,"INTERPOLATED","The beachhead expanded as units consolidated and prepared to drive farther inland. This waypoint represents reconstructed campaign movement."],["Tour-en-Bessin","June 8–9, 1944",7,"DOCUMENTED","The division fought through the Tour-en-Bessin sector as Allied forces widened the Normandy lodgment."],["Normandy Bocage","June 9, 1944",9.5,"APPROXIMATE","Dense hedgerows restricted movement and visibility and gave defenders concealed positions."],["Advance South","June 9–11, 1944",12,"APPROXIMATE","The division continued south toward the next objectives beyond the initial beachhead."],["Cerisy Forest","June 11–12, 1944",16,"DOCUMENTED","The advance reached the Cerisy Forest sector, with Caumont becoming an important objective."],["Approach to Caumont","June 12, 1944",20,"APPROXIMATE","American forces closed on Caumont as resistance and difficult terrain continued to shape the advance."],["Caumont-l'Éventé","June 13, 1944",23,"DOCUMENTED","The prototype chapter concludes at Caumont-l'Éventé during the division's advance from Omaha Beach."]];
const P=[[8,8],[18,20],[30,30],[41,40],[52,50],[62,60],[71,69],[80,78],[88,86],[95,94]];
let real=Number(localStorage.qwRealV2||0), mult=5; function camp(){return Math.min(23,real*mult)} function save(){localStorage.qwRealV2=real}
function add(x){real=Math.max(0,real+x);save();render()} function reset(){real=0;save();render()}
function openStory(i){if(S[i][2]>camp())return;let s=S[i];num.textContent=`LOCATION ${i+1} OF ${S.length}`;name.textContent=s[0];date.textContent=s[1];story.textContent=s[4];tag.textContent=s[3]+" ROUTE EVIDENCE";overlay.classList.add("on")}
function closeStory(){overlay.classList.remove("on")}
function render(){let c=camp(),u=S.filter(s=>s[2]<=c),n=S.find(s=>s[2]>c);fill.style.width=(c/23*100)+"%";miles.textContent=c.toFixed(1)+" / 23 MI";count.textContent=u.length+" / 10 LOCATIONS";next.textContent=n?n[0]:"CHAPTER COMPLETE";remain.textContent=n?(n[2]-c).toFixed(1)+" campaign miles remaining":"Caumont reached.";
pins.innerHTML=S.map((s,i)=>{let d=s[2]<=c,now=d&&(!S[i+1]||S[i+1][2]>c);return `<div class="pin ${d?'done':''} ${now?'now':''}" style="left:${P[i][0]}%;top:${P[i][1]}%"><button onclick="openStory(${i})">${d?(now?'★':'✓'):'🔒'}</button><label>${d?s[0]:'???'}</label></div>`}).join("")} render();
</script></body></html>
